<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Harmonics — Prototyp</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <canvas id="stage"></canvas>

    <div class="hud">
      <div class="panel panel--res" id="res">
        <div class="res-row"><span class="glyph glyph--teal">&#9661;</span><span id="echo">0</span></div>
        <div class="res-row res-row--sub"><span class="glyph glyph--amber">&#9650;</span><span id="rate">0 /s</span></div>
        <div class="res-row res-row--sub"><span class="glyph glyph--pink">&#10022;</span><span id="threshold">Schwelle: Grad 2</span></div>
        <div class="res-row res-row--sub"><span class="glyph glyph--magenta">&#9670;</span><span id="record">Rekord: Grad 0</span></div>
      </div>

      <button class="icon-btn" id="settings" title="Einstellungen">&#9881;</button>

      <div class="panel panel--predictor" id="predictor">
        <div class="pred-label">N&Auml;CHSTE KONVERGENZ</div>
        <div class="pred-main">
          <span class="pred-grade" id="predGrade">Grad &mdash;</span>
          <span class="pred-time" id="predTime">&mdash;</span>
        </div>
        <div class="pred-bar"><div class="pred-fill" id="predFill"></div></div>
        <div class="pred-hint" id="predHint">
          Knoten, die gleichzeitig durch dieselbe Linie laufen, zahlen aus.
          Je mehr gleichzeitig, desto exponentiell mehr.
        </div>
      </div>

      <button class="big-btn" id="viewToggle">UPGRADES</button>
    </div>

    <div class="tooltip hidden" id="tooltip"></div>
    <div class="toast hidden" id="toast"></div>

    <div class="modal hidden" id="modal">
      <div class="modal-card">
        <h2>Einstellungen</h2>
        <p class="modal-sub">Harmonics &mdash; Prototyp v0.1</p>
        <button class="ghost-btn" id="wipe">Spielstand l&ouml;schen</button>
        <button class="ghost-btn" id="closeModal">Schlie&szlig;en</button>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

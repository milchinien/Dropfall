<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Idler Incremental — Prototypen</title>
    <!-- Dasselbe Loader-Bauteil wie in den Prototypen. Als <link>, damit
         der Ladeschirm ohne Skript sichtbar ist. -->
    <link rel="stylesheet" href="/prototypes/shared/loader.css" />
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: "Segoe UI", system-ui, sans-serif;
        background: #0f1115;
        color: #eef1f6;
      }
      main {
        width: min(880px, 92vw);
        padding: 48px 0;
      }
      h1 {
        font-size: 1.4rem;
        font-weight: 700;
        text-align: center;
        margin: 0 0 8px;
        letter-spacing: 0.02em;
      }
      p.sub {
        text-align: center;
        color: #8b93a7;
        margin: 0 0 40px;
        font-size: 0.95rem;
      }
      .cards {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 24px;
      }
      a.card {
        display: block;
        padding: 28px;
        border-radius: 16px;
        background: #171a21;
        border: 1px solid #262b36;
        text-decoration: none;
        color: inherit;
        transition: transform 0.15s ease, border-color 0.15s ease;
      }
      a.card:hover {
        transform: translateY(-2px);
        border-color: #3a4152;
      }
      .card h2 {
        margin: 0 0 8px;
        font-size: 1.15rem;
      }
      .card p {
        margin: 0 0 16px;
        color: #a7adbc;
        font-size: 0.9rem;
        line-height: 1.5;
      }
      .card .port {
        font-size: 0.8rem;
        color: #5c6376;
      }
      #boot {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: grid;
        place-items: center;
        background: #0f1115;
        transition: opacity 0.35s ease, visibility 0.35s ease;
      }
      #boot.is-done {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="boot">
      <div class="ldr ldr--md ldr--on-dark">
        <div class="ldr__rings" aria-hidden="true">
          <div class="ldr__ring ldr__ring--outer"></div>
          <div class="ldr__ring ldr__ring--main"></div>
          <div class="ldr__ring ldr__ring--counter"></div>
          <div class="ldr__ring ldr__ring--accent"></div>
        </div>
        <div class="ldr__text">
          <p class="ldr__title"><span>Prototypen werden geladen</span></p>
          <p class="ldr__subtitle"><span>Gleich kannst du wählen</span></p>
        </div>
      </div>
    </div>

    <main>
      <h1>Idler Incremental</h1>
      <p class="sub">Prototyp wählen</p>
      <div class="cards">
        <a class="card" href="http://localhost:5274" target="_blank" rel="noopener">
          <h2>Dropfall</h2>
          <p>Physik-Maschine: Kugeln, Pegs, Combos. Ziel: niemals stillstehen.</p>
          <span class="port">localhost:5274</span>
        </a>
      </div>
    </main>
    <!-- Mindeststandzeit, sonst blitzt der Ring nur auf: die Startseite ist
         praktisch sofort da. -->
    <script>
      (() => {
        const start = performance.now();
        addEventListener(
          "load",
          () => {
            const boot = document.getElementById("boot");
            const rest = Math.max(0, 600 - (performance.now() - start));
            setTimeout(() => {
              if (!boot) return;
              boot.classList.add("is-done");
              setTimeout(() => boot.remove(), 400);
            }, rest);
          },
          { once: true }
        );
      })();
    </script>
  </body>
</html>
